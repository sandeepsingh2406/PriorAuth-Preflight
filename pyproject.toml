[project]
name = "priorauth-preflight"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai-agents==0.24.0",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
